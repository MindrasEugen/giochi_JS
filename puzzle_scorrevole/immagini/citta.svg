    <rect x="72" y="320" width="10" height="14"/><rect x="90" y="360" width="10" height="14"/><rect x="120" y="250" width="8" height="12"/>
    <rect x="132" y="300" width="8" height="12"/><rect x="164" y="300" width="12" height="16"/><rect x="186" y="350" width="12" height="16"/>
    <rect x="266" y="290" width="16" height="20"/><rect x="318" y="290" width="16" height="20"/><rect x="266" y="340" width="16" height="20"/>
    <rect x="392" y="260" width="10" height="14"/><rect x="410" y="310" width="10" height="14"/><rect x="444" y="310" width="12" height="16"/>
    <rect x="470" y="350" width="12" height="16"/><rect x="510" y="230" width="10" height="14"/><rect x="530" y="290" width="10" height="14"/>
