  <path d="M240 180 L300 100 L360 180 Z" fill="#3a3d5c"/>
  <circle cx="300" cy="230" r="30" fill="#fff8dc"/>
  <g stroke="#2b2d42" stroke-width="4" stroke-linecap="round"><path d="M300 230 L300 210"/><path d="M300 230 L314 238"/></g>
