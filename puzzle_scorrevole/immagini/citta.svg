  <rect y="460" width="600" height="140" fill="#14213d"/>
  <path d="M0 450 Q150 380 300 450 Q450 380 600 450 L600 462 L0 462 Z" fill="#8d99ae"/>
  <g stroke="#8d99ae" stroke-width="3"><path d="M75 420 L75 450"/><path d="M150 400 L150 450"/><path d="M225 420 L225 450"/><path d="M375 420 L375 450"/><path d="M450 400 L450 450"/><path d="M525 420 L525 450"/></g>
