    <circle cx="300" cy="90" r="1.2"/><circle cx="360" cy="25" r="2"/><circle cx="560" cy="40" r="1.5"/><circle cx="520" cy="120" r="1.2"/>
    <circle cx="60" cy="140" r="1.2"/><circle cx="200" cy="130" r="1.5"/>
  </g>
  <path d="M250 60 l3 8 l8 0 l-6 5 l2 8 l-7 -5 l-7 5 l2 -8 l-6 -5 l8 0 Z" fill="#ffe066"/>
  <!-- luna piena -->
  <circle cx="460" cy="90" r="46" fill="#fff3c4"/>
  <g fill="#f1dca7"><circle cx="445" cy="78" r="8"/><circle cx="475" cy="105" r="6"/><circle cx="470" cy="70" r="4"/></g>
