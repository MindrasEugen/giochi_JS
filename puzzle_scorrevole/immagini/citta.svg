  <path d="M120 560 L260 560 L240 585 L140 585 Z" fill="#e76f51"/>
  <rect x="150" y="536" width="80" height="24" fill="#f4a261"/>
  <g fill="#fff3b0"><rect x="160" y="542" width="12" height="10"/><rect x="184" y="542" width="12" height="10"/><rect x="208" y="542" width="12" height="10"/></g>
  <rect x="196" y="516" width="8" height="20" fill="#264653"/>
