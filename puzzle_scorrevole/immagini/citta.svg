      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.7" stop-color="#3a506b"/>
      <stop offset="1" stop-color="#5bc0be"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#cielo)"/>
