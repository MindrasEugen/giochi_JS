<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Faro sul mare: illustrazione originale per il Puzzle scorrevole -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb3e8"/>
      <stop offset="1" stop-color="#d8f1ff"/>
    </linearGradient>
    <linearGradient id="mare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fc4"/>
      <stop offset="1" stop-color="#0e4a7a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#cielo)"/>
  <!-- sole -->
  <circle cx="90" cy="80" r="44" fill="#ffd23f"/>
  <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round">
    <path d="M90 14 V0"/><path d="M90 146 V160"/><path d="M24 80 H10"/><path d="M156 80 H170"/>
    <path d="M44 34 L34 24"/><path d="M136 126 L146 136"/><path d="M136 34 L146 24"/><path d="M44 126 L34 136"/>
  </g>
  <!-- nuvole -->
  <g fill="#ffffff">
    <ellipse cx="300" cy="70" rx="60" ry="22"/><ellipse cx="340" cy="56" rx="40" ry="24"/><ellipse cx="270" cy="62" rx="30" ry="18"/>
    <ellipse cx="500" cy="150" rx="50" ry="16"/><ellipse cx="530" cy="140" rx="30" ry="16"/>
  </g>
  <!-- gabbiani -->
  <g fill="none" stroke="#33475b" stroke-width="3" stroke-linecap="round">
    <path d="M200 140 q10 -10 20 0 q10 -10 20 0"/><path d="M250 180 q8 -8 16 0 q8 -8 16 0"/><path d="M420 90 q7 -7 14 0 q7 -7 14 0"/>
  </g>
  <!-- isola lontana -->
  <path d="M330 340 Q400 300 470 340 Z" fill="#6aa58a"/>
  <!-- mare -->
  <rect y="340" width="600" height="260" fill="url(#mare)"/>
  <g fill="none" stroke="#9fdcff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M20 380 q15 -8 30 0 t30 0"/><path d="M260 400 q15 -8 30 0 t30 0"/><path d="M420 370 q12 -6 24 0 t24 0"/>
    <path d="M120 460 q15 -8 30 0 t30 0"/><path d="M380 480 q15 -8 30 0 t30 0"/><path d="M60 540 q15 -8 30 0 t30 0"/>
  </g>
  <!-- barca a vela -->
  <path d="M340 430 L460 430 L440 456 L360 456 Z" fill="#e94f37"/>
  <rect x="398" y="330" width="5" height="100" fill="#4a3b2c"/>
  <path d="M403 336 L452 424 L403 424 Z" fill="#ffffff"/>
  <path d="M398 350 L360 424 L398 424 Z" fill="#ffe8a3"/>
  <path d="M398 330 L420 338 L398 346 Z" fill="#2e86ab"/>
  <!-- scogliera a sinistra -->
  <path d="M0 600 L0 330 L40 310 L90 330 L130 320 L190 380 L220 440 L260 520 L280 600 Z" fill="#8c7a6b"/>
  <path d="M0 600 L0 420 L60 400 L120 430 L170 480 L210 600 Z" fill="#6e5e52"/>
  <g fill="#5e8f4e"><ellipse cx="60" cy="318" rx="60" ry="12"/><ellipse cx="140" cy="326" rx="30" ry="8"/></g>
  <!-- faro -->
  <path d="M70 312 L80 140 L120 140 L130 312 Z" fill="#ffffff"/>
  <path d="M76 230 L124 230 L126 262 L74 262 Z M79 170 L121 170 L122 198 L78 198 Z M73 286 L127 286 L129 312 L71 312 Z" fill="#d7263d"/>
  <rect x="72" y="128" width="56" height="12" fill="#2d3142"/>
  <rect x="82" y="100" width="36" height="28" fill="#ffe66d"/>
  <path d="M78 100 L100 78 L122 100 Z" fill="#2d3142"/>
  <rect x="92" y="290" width="16" height="22" rx="8" fill="#2d3142"/>
  <!-- raggi del faro -->
  <path d="M118 108 L240 70 L240 140 Z" fill="#fff6b0" opacity="0.6"/>
  <!-- boa e onde in basso a destra -->
  <path d="M500 520 L540 520 L530 470 L510 470 Z" fill="#ff9f1c"/>
  <rect x="506" y="486" width="28" height="8" fill="#ffffff"/>
  <circle cx="520" cy="462" r="8" fill="#e71d36"/>
  <g fill="#ffffff" opacity="0.85"><ellipse cx="520" cy="524" rx="30" ry="5"/><ellipse cx="300" cy="580" rx="70" ry="6"/></g>
  <!-- pesce che salta -->
  <path d="M560 400 q20 -30 0 -40 q-10 20 0 40 Z" fill="#ffd23f"/>
  <circle cx="556" cy="372" r="2" fill="#1b1b1b"/>
</svg>
