<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giochi JS</title>
  <link rel="stylesheet" href="./css/comune.css">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <!-- Presentazione -->
  <header class="contenitore intestazione">
    <h1>Giochi JS</h1>
    <p class="presentazione"><span id="totale-giochi">18</span> giochi da browser scritti in HTML, CSS e JavaScript.</p>
    <div class="ricerca">
      <label for="cerca" class="nascosto-visivamente">Cerca un gioco</label>
      <input id="cerca" type="search" placeholder="Cerca un gioco…" autocomplete="off">
    </div>
  </header>
  <!-- Giochi, divisi per categoria (disegnati da home.js) -->
  <main class="contenitore">
    <div id="categorie"></div>
    <p id="nessun-risultato" class="nessun-risultato" hidden>Nessun gioco trovato.</p>
  </main>
  <!-- Chiusura -->
  <footer class="contenitore">
    <p>Progetto di esercizio — HTML, CSS e JavaScript</p>
  </footer>
  <script src="./home.js"></script>
</body>
</html>
