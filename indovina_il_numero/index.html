<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/comune.css">
        <link rel="stylesheet" href="./style.css">
        <title>Indovina il numero</title>
    </head>

    <body>
        <div class="contenitore">
            <a class="link-home" href="../index.html">← Tutti i giochi</a>
            <h1>Indovina il numero</h1>
            <div class="istruzioni">
                <h2>Istruzioni</h2>
                <p>il computer pensa a un numero intero da 1 a 100. L'utente lo scrive in un campo di testo e preme un
                    bottone. La pagina risponde con "Troppo alto", "Troppo basso" oppure "Indovinato in X tentativi!"
                </p>
            </div>
            <form id="form">
                <label for="difficolta">Scegli la difficolta:</label>
                <select name="difficolta" id="difficolta">
                    <option value="10">Facile</option>
                    <option value="7">Media</option>
                    <option value="5">Difficile</option>
                </select>

                <label for="input">Il tuo numero:</label>
                <input id="input" name="numero" type="number" min="1" max="100" required autofocus>
                <div class="azioni">
                    <button id="button" type="submit" class="pulsante">Prova</button>
                    <button id="reset" type="button" class="pulsante pulsante--secondario">Nuova partita</button>
                </div>
            </form>
            <div class="comunicazioni" aria-live="polite">
                <p id="messaggi"></p>
                <p id="contatore"></p>
            </div>
        </div>
        <script src="./main.js"></script>
    </body>

</html>
